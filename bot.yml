name: arb-bot

on:
  schedule:
    - cron: "0 * * * *"          # tiap jam
  workflow_dispatch:
    inputs:
      test:
        description: "Uji: DRY_RUN + tampilkan log, hanya 5 menit"
        type: boolean
        default: false

# Satu run saja pada satu waktu; run berikutnya antre sampai yang berjalan selesai.
concurrency:
  group: arb-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Jalankan bot
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.test && '1' || '' }}
          DEBUG: ${{ inputs.test && '1' || '' }}
          DURATION: ${{ inputs.test && '5m' || '58m' }}
        run: |
          set +e
          timeout --signal=SIGTERM "$DURATION" node app.js
          code=$?
          if [ $code -eq 124 ]; then exit 0; fi   # berhenti karena batas waktu = normal
          exit $code
      - name: Log uji
        if: always() && inputs.test
        run: cat bot.log || true
